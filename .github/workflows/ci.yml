name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # Versiones exactas y verificadas por hash: una librería alterada no entraría sin avisar.
      # El archivo se regenera con `uv pip compile` (ver docs/CALIDAD.md).
      - name: Instalar dependencias
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-dev.lock

      # Si la cobertura baja del 80 %, el CI falla.
      - name: Ejecutar pruebas con cobertura
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      # SonarCloud analiza desde la raíz del repositorio y necesita rutas como backend/app/...
      - name: Preparar la cobertura para SonarCloud
        run: python -m scripts.cobertura_para_sonar

      - name: Guardar reportes de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            backend/coverage.xml
            backend/sonar-coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: ningún paquete ejecuta código propio al instalarse.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # El umbral mínimo de cobertura (80 %) está en angular.json.
      - name: Ejecutar pruebas con cobertura
        run: npm run test:ci

      - name: Compilar
        run: npm run build

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

  # Análisis de calidad en SonarCloud. Solo corre si el secreto SONAR_TOKEN existe
  # (Settings > Secrets and variables > Actions); sin él, el CI sigue funcionando igual.
  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita todo el historial para detectar el código nuevo

      - uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: backend

      - uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

      # La acción de un tercero se fija por su SHA completo (v8.5.0): una etiqueta puede
      # reasignarse a otro código; un SHA no.
      - name: Analizar con SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
