<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Página no encontrada | Container Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.5;
      color: #1c2430; background: #f4f5f7; text-align: center; }
    h1 { margin: 0 0 0.5rem; font-size: 4rem; color: #1d4ed8; }
    p { margin: 0 0 1.5rem; }
    a { display: inline-block; padding: 0.75rem 1.5rem; font-weight: 600; text-decoration: none;
      color: #fff; background: #1d4ed8; border-radius: 0.5rem; }
    @media (prefers-color-scheme: dark) {
      body { color: #e8ecf1; background: #11151c; }
      h1 { color: #6ea0ff; }
      a { color: #0b1220; background: #6ea0ff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>La página que buscas no existe o cambió de lugar.</p>
    <a href="/">Ir al inicio</a>
  </main>
</body>
</html>
