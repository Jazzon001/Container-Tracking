# Configuración del análisis de SonarCloud. Ver docs/CALIDAD.md.
# El token NO va aquí: está en el secreto SONAR_TOKEN de GitHub.
sonar.organization=jazzon001
sonar.projectKey=Jazzon001_Container-Tracking
sonar.projectName=Container Tracking

# Todo el código del proyecto: la aplicación, sus scripts y migraciones, el frontend y el CI.
# Las pruebas se declaran aparte para que no cuenten como código de producción.
sonar.sources=backend/app,backend/scripts,backend/migrations,frontend/src,frontend/tools,.github/workflows
sonar.tests=backend/test,frontend/src
sonar.test.inclusions=backend/test/**,frontend/src/**/*.spec.ts
sonar.exclusions=frontend/src/**/*.spec.ts

# Cobertura. El backend usa el XML con rutas ajustadas por el CI; el frontend, el lcov de Vitest.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/sonar-coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/container-tracking/lcov.info
# No se miden: las migraciones y las herramientas de compilación (código generado o de apoyo)
# ni el service worker (se ejecuta en el navegador, fuera de las pruebas de Vitest).
sonar.coverage.exclusions=backend/migrations/**,frontend/tools/**,frontend/src/main.ts,frontend/public/sw.js

# Las pruebas repiten estructuras a propósito (preparar, actuar, comprobar): no cuentan como duplicación.
sonar.cpd.exclusions=backend/test/**,frontend/src/**/*.spec.ts,backend/migrations/**
