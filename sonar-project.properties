# Configuración del análisis de SonarCloud. Ver docs/CALIDAD.md.
#
# ANTES DE USARLO: reemplaza las dos líneas marcadas con los valores que muestra SonarCloud
# al importar el proyecto (no son secretos). El token NO va aquí: está en el secreto
# SONAR_TOKEN de GitHub.
sonar.organization=REEMPLAZAR_CON_TU_ORGANIZACION
sonar.projectKey=REEMPLAZAR_CON_TU_PROJECT_KEY
sonar.projectName=Container Tracking

# Código de la aplicación (sin las pruebas, las migraciones ni los scripts de administración)
sonar.sources=backend/app,frontend/src
sonar.tests=backend/test,frontend/src
sonar.test.inclusions=backend/test/**,frontend/src/**/*.spec.ts
sonar.exclusions=frontend/src/**/*.spec.ts

# Cobertura. El backend usa el XML con rutas ajustadas por el CI; el frontend, el lcov de Vitest.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/sonar-coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/container-tracking/lcov.info
sonar.coverage.exclusions=backend/test/**,frontend/src/**/*.spec.ts,frontend/src/main.ts

# Las pruebas repiten estructuras a propósito (preparar, actuar, comprobar): no cuentan como duplicación.
sonar.cpd.exclusions=backend/test/**,frontend/src/**/*.spec.ts
